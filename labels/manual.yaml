# ---------------------------------------------------------------- 2008-07-15 sole shareholder decisions of 27 June 2008
63e9593b8be6eb9f9d257ec3:
  summary_en: "Extract of the sole shareholder's (HADEAN) decisions of 27 June 2008: par value divided by 100, creation of preference shares A, B and B', reserved increase of 17,241 A shares and of 150,861 B shares (with warrants) at 5.80 EUR, bringing capital from 200,000 to 368,102 EUR; updated statutes."
  decision_dates:
    - {date: "2008-06-27", body: associée unique, evidence: [p1.20, p1.21]}
  events:
    - {code: CAPITAL_DUAL_CLASS, status: completed_here, effective_date: "2008-06-27", date_basis: decision of the sole shareholder on 27 June 2008,
       share_class: A, mechanism: "preference shares A (art. L. 228-11), conditional on both capital increases",
       gloss_en: The sole shareholder creates class A preference shares., evidence: [p2.18, p2.26, p2.27]}
    - {code: CAPITAL_DUAL_CLASS, status: completed_here, effective_date: "2008-06-27", date_basis: decision of the sole shareholder on 27 June 2008,
       share_class: B and B', mechanism: "preference shares B and B' (B convertible into B'), conditional on both capital increases",
       gloss_en: The sole shareholder creates class B and B' preference shares., evidence: [p2.29, p2.37, p2.38, p2.39]}
    - {code: CAPITAL_INCREASE, status: completed_here, effective_date: "2008-06-27",
       date_basis: "decided on 27 June 2008 with subscriptions open until 18 July 2008 (p3.12-13); the statutes filed with the decisions already show 368,102 EUR",
       amount_eur: 17241, capital_before_eur: 200000, capital_after_eur: 217241, shares_delta: 17241, nominal_eur: 1, share_class: A, price_per_share_eur: 5.8, method: numeraire,
       mechanism: "reserved issue of 17,241 preference shares A at 5.80 EUR (4.80 EUR premium), payable in cash or by debt offset",
       gloss_en: "Capital increase I: nominal increase of 17,241 EUR by issuing 17,241 new class A shares of 1 EUR.", evidence: [p2.48, p2.49, p2.50]}
    - {code: CAPITAL_INCREASE, status: completed_here, effective_date: "2008-06-27",
       date_basis: "decided on 27 June 2008 with subscriptions open until 18 July 2008 (p4.8-9); the statutes filed with the decisions already show 368,102 EUR",
       amount_eur: 150861, capital_before_eur: 217241, capital_after_eur: 368102, shares_delta: 150861, nominal_eur: 1, share_class: B, price_per_share_eur: 5.8, method: numeraire,
       mechanism: "reserved issue of 150,861 preference shares B with warrants for convertible bonds (ABSOC) at 5.80 EUR, to persons named in resolutions 12-15",
       gloss_en: "Capital increase II: nominal increase of 150,861 EUR by issuing 150,861 new class B shares of 1 EUR.", evidence: [p3.42, p3.43, p3.44]}
  snapshots:
    - {as_of: "2008-06-27", as_of_basis: HADEAN acts as sole shareholder (associée unique) when the decisions are taken, holders_complete: true,
       holders: [{name: HADEAN, kind: COMPANY, siren: "499979540"}], evidence: [p1.32, p1.33, p1.34]}
    - {as_of: "2008-06-27", as_of_basis: first resolution (par value divided by 100), capital_eur: 200000, shares_total: 200000, nominal_eur: 1, evidence: [p1.47, p1.48]}
