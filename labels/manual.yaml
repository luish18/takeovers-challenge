  decision_dates:
    - {date: "2004-12-15", body: constitution, evidence: [p24.11, p24.12]}
  events:
    - {code: SHAREHOLDER_ENTRY, status: completed_here, effective_date: "2004-12-15", date_basis: "statutes signed in Montauban on 15 December 2004 (p24)",
       holder_name: Xavier AUMONT, holder_kind: PERSON, shares: 155, mechanism: cash contribution at incorporation,
       gloss_en: Founder Xavier AUMONT is allotted 155 shares., evidence: [p3.17, p3.18]}
    - {code: SHAREHOLDER_ENTRY, status: completed_here, effective_date: "2004-12-15", date_basis: "statutes signed in Montauban on 15 December 2004 (p24)",
       holder_name: Antonio BLANCO MARINA, holder_kind: PERSON, shares: 155, mechanism: cash contribution at incorporation,
       gloss_en: Founder Antonio BLANCO MARINA is allotted 155 shares., evidence: [p3.19, p3.20]}
    - {code: SHAREHOLDER_ENTRY, status: completed_here, effective_date: "2004-12-15", date_basis: "statutes signed in Montauban on 15 December 2004 (p24)",
       holder_name: Franck GICQUEL, holder_kind: PERSON, shares: 60, mechanism: cash contribution at incorporation,
       gloss_en: Founder Franck GICQUEL is allotted 60 shares., evidence: [p3.22, p3.23]}
  snapshots:
    - {as_of: "2004-12-15", as_of_basis: incorporation statutes article 7, capital_eur: 37000, shares_total: 370, nominal_eur: 100, holders_complete: true,
       holders: [{name: Xavier AUMONT, kind: PERSON, shares: 155}, {name: Antonio BLANCO MARINA, kind: PERSON, shares: 155}, {name: Franck GICQUEL, kind: PERSON, shares: 60}],
       evidence: [p3.14, p3.15, p3.16]}
  issues:
    - Shares were paid up by half at incorporation (18,500 EUR deposited); later statutes say fully paid on 31/03/2005.

# ---------------------------------------------------------------- 2006-01-03 EGM of 17 May 2005
63e9593b8be6eb9f9d257ec4:
  summary_en: Minutes of the EGM of 17 May 2005 recording that the capital increase planned by the EGM of 4 March 2005 (+113,000 EUR, 1,130 new cash shares of 100 EUR) was carried out, bringing capital to 150,000 EUR; also appointments (out of scope) and updated statutes.
  decision_dates:
    - {date: "2005-05-17", body: AGE, evidence: [p1.39]}
  events:
    - {code: CAPITAL_INCREASE, status: realisation_of_earlier_decision, effective_date: "2005-05-17", date_basis: EGM of 17 May 2005 records the final completion of the increase,
       amount_eur: 113000, capital_before_eur: 37000, capital_after_eur: 150000, shares_delta: 1130, nominal_eur: 100, method: numeraire,
       mechanism: "cash subscription of 1,130 new shares, decided by the EGM of 4 March 2005",
       gloss_en: "The meeting records the completion of the 113,000 EUR increase through 1,130 new 100 EUR cash shares, bringing capital to 150,000 EUR.",
       evidence: [p2.29, p2.30, p2.31]}
  snapshots:
    - {as_of: "2005-05-17", as_of_basis: article 7 as rewritten by the second resolution, capital_eur: 150000, shares_total: 1500, nominal_eur: 100, evidence: [p2.33, p2.34]}
  issues:
    - The EGM of 4 March 2005 that decided the increase is not in the corpus, and the subscribers of the 1,130 new shares are not named.
    - Holders present or represented own 1,155 of the 1,500 shares (p1.55), so the cap table had holders beyond the three founders.

# ---------------------------------------------------------------- 2006-01-04 EGM of 8 August 2005
63e9593b8be6eb9f9d257ec2:
  summary_en: Minutes of the OGM of 2 September 2005 (officers, out of scope) and of the EGM of 8 August 2005, which ratified the sale of all shares held by Malik GUELLATI, Christophe LEROUX and Marielle ROUJEAN and recorded the split resulting from transfer orders dated 16 August 2005.
  decision_dates:
    - {date: "2005-08-08", body: AGE, evidence: [p5.9]}
    - {date: "2005-09-02", body: AGO, evidence: [p1.19]}
  events:
    - &exit2005 {code: SHAREHOLDER_END, status: completed_here, effective_date: "2005-08-16", date_basis: "transfer orders dated 16 August 2005 (p6.29)",
       holder_name: Malik GUELLATI, holder_kind: PERSON, mechanism: sale of all his shares under a protocol derogating from the pre-emption clause,
       gloss_en: "The meeting approves the protocol for the sale of all shares held by GUELLATI, LEROUX and ROUJEAN.",
       evidence: [p6.24, p6.25, p6.26]}
    - {<<: *exit2005, holder_name: Christophe LEROUX}
    - {<<: *exit2005, holder_name: Marielle ROUJEAN}
  snapshots:
    - {as_of: "2005-08-16", as_of_basis: new split after the transfer orders of 16 August 2005, holders_complete: true,
       holders: [{name: Antonio BLANCO, kind: PERSON, shares: 823, pct: 54.87}, {name: Xavier AUMONT, kind: PERSON, shares: 617, pct: 41.13}, {name: Franck GICQUEL, kind: PERSON, shares: 60, pct: 6.0}],
       evidence: [p6.29, p6.30, p6.31, p6.32, p6.33, p6.34, p6.35, p6.36, p6.37, p6.38, p6.39]}
  issues:
    - "GICQUEL's 60 shares are printed as 6,00 % (60 / 1,500 = 4,00 %); the printed percentages add up to 102 % (checked on the page image)."
    - The resolution says this split prevails over the one in the sale protocol, which 'contains an error'; the protocol is not in the corpus.
    - Buyers and per-seller share counts are not stated. The new split is consistent with AUMONT and BLANCO buying the 1,130 shares issued in May 2005 from the three sellers.

# ---------------------------------------------------------------- 2007-02-20 EGM of 20 October 2006
63e9593b8be6eb9f9d257ec7:
  summary_en: "EGM of 20 October 2006: capital increase of 50,000 EUR to 200,000 EUR (500 shares of 100 EUR at par, paid by offset of current-account debts) reserved to AUMONT (330), BLANCO MARINA (150) and GICQUEL (20); approval of Michel CAPGRAS as a shareholder and authorisation for AUMONT to sell him 225 shares; attendance sheet; updated statutes."
  decision_dates:
    - {date: "2006-10-20", body: AGE, evidence: [p1.34]}
  events:
    - {code: CAPITAL_INCREASE, status: completed_here, effective_date: "2006-10-20",
       date_basis: "decided on 20 October 2006 with rights from that day (p3.13); the updated statutes filed with the minutes show 200,000 EUR",
       amount_eur: 50000, capital_before_eur: 150000, capital_after_eur: 200000, shares_delta: 500, nominal_eur: 100, method: numeraire,
       mechanism: "reserved issue at par, paid by offset against debts (compensation de créances)",
       subscribers: [{name: Xavier AUMONT, shares: 330}, {name: Antonio BLANCO MARINA, shares: 150}, {name: Franck GICQUEL, shares: 20}],
       gloss_en: "Capital is increased by 50,000 EUR from 150,000 to 200,000 EUR by creating 500 new 100 EUR shares paid by debt offset.",
       evidence: [p3.8, p3.9, p3.10, p3.11]}
    - {code: SHAREHOLDER_ENTRY, status: authorisation_only, effective_date: "2006-10-20", date_basis: approval by the EGM of 20 October 2006,
       holder_name: Michel CAPGRAS, holder_kind: PERSON, shares: 225, mechanism: approval (agrément) as a new shareholder,
       gloss_en: The meeting approves Michel CAPGRAS becoming a shareholder., evidence: [p4.31, p4.32, p4.33]}
    - {code: SHAREHOLDER_SHARE_TRANSFER, status: authorisation_only, effective_date: "2006-10-20", date_basis: authorisation by the EGM of 20 October 2006,
       from_name: Xavier AUMONT, to_name: Michel CAPGRAS, shares: 225, mechanism: sale authorised, pre-emption rights waived,
       gloss_en: The meeting authorises Xavier AUMONT to sell 225 shares to Michel CAPGRAS., evidence: [p5.2, p5.3, p5.4]}
  snapshots:
    - {as_of: "2006-10-20", as_of_basis: attendance sheet of the EGM (before its decisions), capital_eur: 150000, shares_total: 1500, holders_complete: true,
       holders: [{name: Antonio BLANCO, kind: PERSON, shares: 803}, {name: Xavier AUMONT, kind: PERSON, shares: 637}, {name: Franck GICQUEL, kind: PERSON, shares: 60}],
       evidence: [p6.18, p6.19, p6.25, p6.26, p6.32, p6.33, p6.38, p6.39]}
    - {as_of_basis: updated statutes article 7 filed with the minutes, capital_eur: 200000, shares_total: 2000, nominal_eur: 100, evidence: [p10.21, p10.22]}
  issues:
    - The attendance sheet (BLANCO 803, AUMONT 637) disagrees with the split recorded for 16 August 2005 (BLANCO 823, AUMONT 617); no transfer between them is recorded in between.
    - Resolution 5 (capital increase reserved to employees) was rejected; resolution 6 was not put to the vote.
    - Resolution 9 approves in principle a future 100,000 EUR increase for new investors; nothing is issued here.

# ---------------------------------------------------------------- HADEAN 2007-09-18 incorporation by contribution
63f0a89c7a07a2434c069135:
  summary_en: Incorporation statutes of HADEAN (7 September 2007) - Xavier AUMONT contributes 742 and Franck GICQUEL 80 ARCHEAN TECHNOLOGIES shares, valued at 575 EUR each, in exchange for HADEAN shares.
  decision_dates:
    - {date: "2007-09-07", body: constitution (HADEAN), evidence: [p1.16]}
  events:
    - {code: SHAREHOLDER_SHARE_TRANSFER, status: completed_here, effective_date: "2007-09-07",
       date_basis: "contributions take effect on the day of the statutes (p6.28), dated 07/09/2007 (p1.16)",
       from_name: Xavier AUMONT, to_name: HADEAN, shares: 742, price_per_share_eur: 575, mechanism: contribution in kind (apport en nature) to HADEAN at its incorporation,
       gloss_en: "Xavier AUMONT contributes full ownership of his 742 ARCHEAN TECHNOLOGIES shares to HADEAN.", evidence: [p5.29, p5.30, p5.31, p5.32, p5.33]}
    - {code: SHAREHOLDER_SHARE_TRANSFER, status: completed_here, effective_date: "2007-09-07",
       date_basis: "contributions take effect on the day of the statutes (p6.28), dated 07/09/2007 (p1.16)",
       from_name: Franck GICQUEL, to_name: HADEAN, shares: 80, price_per_share_eur: 575, mechanism: contribution in kind (apport en nature) to HADEAN at its incorporation,
       gloss_en: "Franck GICQUEL contributes full ownership of his 80 ARCHEAN TECHNOLOGIES shares to HADEAN.", evidence: [p6.9, p6.10, p6.11, p6.12, p6.13]}
  snapshots:
    - {as_of: "2007-09-07", as_of_basis: description of ARCHEAN TECHNOLOGIES in the contribution clause, capital_eur: 200000, shares_total: 2000, nominal_eur: 100, evidence: [p5.27, p5.28]}
  issues:
    - "AUMONT's 742 shares equal the 2006 attendance sheet (637 + 330 - 225), not the August 2005 split (617 + 330 - 225 = 722)."
    - The origin of GICQUEL's shares cites subscriptions to the increases of 17 May 2005 and 20 October 2006, but ARCHEAN's records show him at 60 shares both before and after May 2005; only the 2006 subscription (20 shares) is corroborated.
    - The contributed stake is described as a minority one (p7.1), consistent with 822 of 2,000 shares.

