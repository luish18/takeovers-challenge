       evidence: [p8.12, p8.13, p8.16, p8.17]}
  issues:
    - This is an extract - resolutions 7, 10, 12-15, 17 and 18 are omitted, so the subscribers of both reserved increases are not named. The four funds whose shares are bought back in 2017 hold exactly the B-share total (150,861).
    - The par value is divided by 100 (100 EUR to 1 EUR, 2,000 to 200,000 shares) before the increases; nobody's percentage changes.
    - HADEAN is sole shareholder here, but ARCHEAN's filings never record how BLANCO's shares reached HADEAN.

