63e9593a8be6eb9f9d257ebe:
  summary_en: President's decisions of 21 February 2017 carrying out the authorised reduction - 150,861 shares bought back from four funds and cancelled, capital reduced to 217,241 EUR, now wholly held by HADEAN; auditor's report; updated statutes.
  decision_dates:
