# Hand labels in the extraction schema (see src/takeovers_challenge/manual.py). Evidence = OCR line ids; quotes are
# filled from the OCR. Produced by reading the OCR text, with the ambiguous tables checked on the rendered PDF pages.
# Restated history in later statutes is deliberately not labelled (it only corroborates).

# ---------------------------------------------------------------- 2005-01-25 incorporation statutes
