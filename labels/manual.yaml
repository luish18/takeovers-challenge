       amount_eur: 150861, capital_before_eur: 368102, capital_after_eur: 217241, shares_delta: 150861, nominal_eur: 1, price_per_share_eur: 2.72, method: autre,
       mechanism: "buyback and cancellation of minority shareholders' shares (L. 225-207)",
       gloss_en: "The meeting authorises reducing capital by up to 150,861 EUR, from 368,102 to 217,241 EUR, by buying back minority shareholders' shares for cancellation.",
       evidence: [p3.24, p3.25, p3.26, p3.27, p3.28]}
