       holder_name: FPCI SECURITE, holder_kind: COMPANY, shares: 64655, mechanism: all shares bought back and cancelled,
       gloss_en: The company buys back 64,655 shares from FPCI SECURITE., evidence: [p3.8, p3.9]}
    - {<<: *exit2017, holder_name: FIP GALIA PME 4, shares: 12931, gloss_en: "The company buys back 12,931 shares from FIP GALIA PME 4.", evidence: [p3.10, p3.11]}
    - {<<: *exit2017, holder_name: GALIA VENTURE, shares: 30172, gloss_en: "The company buys back 30,172 shares from GALIA VENTURE.", evidence: [p3.12, p3.13]}
    - {<<: *exit2017, holder_name: FPCI FINANCIERE DE BRIENNE, shares: 43103, gloss_en: "The company buys back 43,103 shares from FPCI FINANCIERE DE BRIENNE.", evidence: [p3.14, p3.15]}
