       amount_eur: 150861, capital_before_eur: 368102, capital_after_eur: 217241, shares_delta: 150861, nominal_eur: 1, price_per_share_eur: 2.72, method: autre,
       mechanism: "buyback and cancellation (excess of 259,480.92 EUR over par charged to other reserves)",
       gloss_en: "The president records that capital is reduced by 150,861 EUR from 368,102 to 217,241 EUR, in 217,241 shares of 1 EUR.",
       evidence: [p3.17, p3.18, p3.19]}
