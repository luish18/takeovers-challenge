[project]
name = "takeovers-challenge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luis", email = "luish.fernandes@usp.br" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.5.0",
    "jsonschema>=4.26.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "tqdm>=4.70.1",
]

[project.scripts]
takeovers-challenge = "takeovers_challenge:main"
actes = "takeovers_challenge.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
